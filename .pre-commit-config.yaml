repos:
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: gui-styles
        name: GUI styling convention
        entry: python src/cibmangotree/gui/_style_rules.py --fix
        language: system
        types: [python]
        files: ^src/cibmangotree/gui/(?!tests/)
