name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Run stale bot
        uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: no-stale
          exempt-pr-labels: no-stale
          stale-issue-message: >-
            This issue has had no activity for 60 days and is marked stale.
            It will be closed in 7 days if there is no further activity.
            Comment or remove the `stale` label to keep it open.
            Add `no-stale` if it should stay exempt.
          stale-pr-message: >-
            This pull request has had no activity for 60 days and is marked stale.
            It will be closed in 7 days if there is no further activity.
            Comment or remove the `stale` label to keep it open.
            Add `no-stale` if it should stay exempt.
          close-issue-message: >-
            Closing this issue because it remained stale with no activity.
            Please open a new issue if this is still relevant.
          close-pr-message: >-
            Closing this pull request because it remained stale with no activity.
            Please reopen or open a new PR if this work is still relevant.
