name: Build GUI Executable

on:
  workflow_call:
    secrets:
      APPLE_DEV_EMAIL:
      APP_SPEC_PASS:
      DEV_APP_CERT:
      DEV_APP_CERT_PASS:
      DEV_INST_CERT:
      DEV_INST_CERT_PASS:
      APPLE_KEY_PASS:
      APPLE_APP_CERT_ID:
      APPLE_INST_CERT_ID:
      TEAM_ID:

    inputs:
      is_release:
        default: false
        description: 'Is this a release?'
        type: boolean
        required: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform_name: Windows
            artifact_name: CIBMangoTree_windows
            os: windows-2022
            list_command: dir dist
            check_command: dist/CIBMangoTree/CIBMangoTree.exe --noop
          - platform_name: MacOS (x86)
            artifact_name: CIBMangoTree_macos-x86
            os: macos-15-intel
            pkg_command: |
              mkdir -p /tmp/cibmangotree/
              ditto dist/CIBMangoTree.app /tmp/cibmangotree/CIBMangoTree.app
              chmod +x /tmp/cibmangotree/CIBMangoTree.app/Contents/MacOS/CIBMangoTree
              security unlock-keychain -p $APPLE_KEYCHAIN_PASS build.keychain
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASS" build.keychain
              security find-identity -v -p codesigning build.keychain
              pkgbuild --identifier "org.civictechdc.cibmangotree.gui" --timestamp --root /tmp/cibmangotree --install-location /Applications "./dist/CIBMangoTree_macos-x86_signed.pkg" --sign "$APPLE_INST_CERT_ID"
            list_command: ls -ll dist
            check_command: dist/CIBMangoTree.app/Contents/MacOS/CIBMangoTree --noop
          - platform_name: MacOS (arm64)
            artifact_name: CIBMangoTree_macos-arm64
            os: macos-15
            pkg_command: |
              mkdir -p /tmp/cibmangotree/
              ditto dist/CIBMangoTree.app /tmp/cibmangotree/CIBMangoTree.app
              chmod +x /tmp/cibmangotree/CIBMangoTree.app/Contents/MacOS/CIBMangoTree
              security unlock-keychain -p $APPLE_KEYCHAIN_PASS build.keychain
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASS" build.keychain
              security find-identity -v -p codesigning build.keychain
              pkgbuild --identifier "org.civictechdc.cibmangotree.gui" --timestamp --root /tmp/cibmangotree --install-location /Applications "./dist/CIBMangoTree_macos-arm64_signed.pkg" --sign "$APPLE_INST_CERT_ID"
            list_command: ls -ll dist
            check_command: dist/CIBMangoTree.app/Contents/MacOS/CIBMangoTree --noop

    name: ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    env:
      artifact_path: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          # Distinct from test.yml pytest jobs: both use setup-uv on windows-2022 /
          # macos-15 in the same Tests run, without this suffix they would share one cache key, resulting in warnings in the CI run.
          cache-suffix: gui

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Create macOS keychain
        id: keychain
        if: runner.os == 'macOS' && inputs.is_release
        env:
          APPLE_DEV_EMAIL: ${{secrets.APPLE_DEV_EMAIL}}
          APP_SPEC_PASS: ${{secrets.APP_SPEC_PASS}}
          APPLE_APP_CERTIFICATE: ${{secrets.DEV_APP_CERT}}
          APPLE_APP_CERT_PASSWORD: ${{secrets.DEV_APP_CERT_PASS}}
          APPLE_INST_CERTIFICATE: ${{secrets.DEV_INST_CERT}}
          APPLE_INST_CERT_PASSWORD: ${{secrets.DEV_INST_CERT_PASS}}
          APPLE_KEYCHAIN_PASS: ${{secrets.APPLE_KEY_PASS}}
        run: |
          echo "$APPLE_APP_CERTIFICATE" | base64 --decode > app_certificate.p12
          echo "$APPLE_INST_CERTIFICATE" | base64 --decode > inst_certificate.p12
          security create-keychain -p $APPLE_KEYCHAIN_PASS build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p $APPLE_KEYCHAIN_PASS build.keychain
          security import app_certificate.p12 -k build.keychain -P $APPLE_APP_CERT_PASSWORD -A
          security import inst_certificate.p12 \
            -k build.keychain \
            -P "$APPLE_INST_CERT_PASSWORD" \
            -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $APPLE_KEYCHAIN_PASS build.keychain
          security find-identity -v -p codesigning -p macappstore

      - name: Print version string (for tag)
        id: get_version_tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python -c "with open('VERSION', 'w', encoding='utf-8') as f: f.write('${{ github.ref_name }}')"

      - name: Print version string (for branch)
        id: get_version_branch
        if: ${{ github.ref_type != 'tag' }}
        run: |
          python -c "with open('VERSION', 'w', encoding='utf-8') as f: f.write('${{ github.ref_name }}-${{ github.sha }}')"

      - name: Build the executable
        env:
          APPLE_APP_CERT_ID: "${{ inputs.is_release && secrets.APPLE_APP_CERT_ID || '' }}"
        run: uv run pyinstaller pyinstaller.spec

      - name: Verify build output
        shell: bash
        run: |
          ls -lah dist/
          echo "Looking for: CIBMangoTree"

      - name: Test executable with --noop
        run: ${{ matrix.check_command }}

      - name: Package Windows - MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -notmatch '(?m)^version = "([^"]+)"') {
            throw "Could not read version from pyproject.toml"
          }

          $parts = $Matches[1].TrimStart("v").Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $msixVersion = ($parts[0..3] -join ".")

          Write-Host "MSIX Identity Version: $msixVersion"

          $root = (Get-Location).Path
          $packRoot = Join-Path $root "msix_payload"

          if (Test-Path $packRoot) {
            Remove-Item $packRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packRoot | Out-Null

          Copy-Item `
            -Path (Join-Path $root "dist\CIBMangoTree\*") `
            -Destination $packRoot `
            -Recurse

          Copy-Item `
            -Path (Join-Path $root "packaging\msix\AppxManifest.xml") `
            -Destination (Join-Path $packRoot "AppxManifest.xml")

          Copy-Item `
            -Path (Join-Path $root "packaging\msix\Assets") `
            -Destination (Join-Path $packRoot "Assets") `
            -Recurse

          $manifestPath = Join-Path $packRoot "AppxManifest.xml"
          $manifest = [System.IO.File]::ReadAllText($manifestPath)

          # Stamp the version supplied by pyproject.toml.
          $manifest = $manifest -replace `
            'Version="0\.0\.0\.0"', `
            "Version=`"$msixVersion`""

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)

          # Verify the Microsoft Store identity from AppxManifest.xml.
          if ($manifest -notmatch 'Name="AlternativeNewsweeklyFoun\.CIBMangoTree"') {
            throw "MSIX manifest has an unexpected Identity Name."
          }

          if ($manifest -notmatch 'Publisher="CN=C14B7C4E-669C-42C0-8DC2-159FACF8C396"') {
            throw "MSIX manifest has an unexpected Publisher."
          }

          if ($manifest -notmatch '<PublisherDisplayName>Alternative Newsweekly Foundation</PublisherDisplayName>') {
            throw "MSIX manifest has an unexpected PublisherDisplayName."
          }

          if ($manifest -notmatch "Version=`"$msixVersion`"") {
            throw "MSIX manifest version was not stamped correctly."
          }

          Write-Host "MSIX manifest identity verified."
          Write-Host "  Name: AlternativeNewsweeklyFoun.CIBMangoTree"
          Write-Host "  Publisher: CN=C14B7C4E-669C-42C0-8DC2-159FACF8C396"
          Write-Host "  Publisher Display Name: Alternative Newsweekly Foundation"
          Write-Host "  Version: $msixVersion"

          $makeappx = @(
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue
            Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\makeappx.exe" -ErrorAction SilentlyContinue
          ) |
            Where-Object { $_ -ne $null } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $makeappx) {
            throw "MakeAppx.exe not found. Install the Windows SDK on this runner."
          }

          Write-Host "Using $($makeappx.FullName)"

          $msixPath = Join-Path $root "dist\${{ matrix.artifact_name }}.msix"

          & $makeappx.FullName pack /d $packRoot /p $msixPath /o /v

          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx pack failed with exit code $LASTEXITCODE"
          }

          Get-Item $msixPath | Format-List Name, Length, FullName

      - name: Clean up redundant onedir folder
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Remove the intermediate CIBMangoTree/ folder (BUNDLE already created .app)
          if [ -d "dist/CIBMangoTree" ] && [ ! -L "dist/CIBMangoTree" ]; then
            rm -rf dist/CIBMangoTree
            echo "Removed redundant dist/CIBMangoTree/ folder"
          fi

      - name: Create and sign macOS package
        if: runner.os == 'macOS' && inputs.is_release
        env:
          APPLE_INST_CERT_ID: ${{secrets.APPLE_INST_CERT_ID}}
          APPLE_KEYCHAIN_PASS: ${{secrets.APPLE_KEY_PASS}}
        run: ${{ matrix.pkg_command }}

      - name: Notarize macOS package
        if: runner.os == 'macOS' && inputs.is_release
        env:
          APPLE_DEV_EMAIL: ${{secrets.APPLE_DEV_EMAIL}}
          APPLE_TEAM_ID: ${{secrets.TEAM_ID}}
          APP_SPEC_PASS: ${{secrets.APP_SPEC_PASS}}
        run: xcrun notarytool submit dist/${{matrix.artifact_name}}_signed.pkg --apple-id $APPLE_DEV_EMAIL --team-id $APPLE_TEAM_ID --password $APP_SPEC_PASS --wait

      - name: Staple notarization ticket
        if: runner.os == 'macOS' && inputs.is_release
        run: xcrun stapler staple dist/${{matrix.artifact_name}}_signed.pkg

      - name: Package artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ inputs.is_release }}" = "true" ]; then
            mv dist/${{matrix.artifact_name}}_signed.pkg dist/${{matrix.artifact_name}}.pkg
            echo "artifact_path=dist/${{matrix.artifact_name}}.pkg" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "Windows" ] && [ "${{ inputs.is_release }}" = "true" ]; then
            powershell -Command "Compress-Archive -Path 'dist/CIBMangoTree' -DestinationPath 'dist/${{matrix.artifact_name}}.zip'"
            echo "artifact_path=dist/${{matrix.artifact_name}}.zip" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "macOS" ]; then
            (cd dist && zip -r -y "${{matrix.artifact_name}}.zip" CIBMangoTree.app)
            echo "artifact_path=dist/${{matrix.artifact_name}}.zip" >> $GITHUB_ENV
          else
            powershell -Command "Compress-Archive -Path 'dist/CIBMangoTree' -DestinationPath 'dist/${{matrix.artifact_name}}.zip'"
            echo "artifact_path=dist/${{matrix.artifact_name}}.zip" >> $GITHUB_ENV
          fi

      - name: Clean up macOS artifacts
        if: runner.os == 'macOS' && inputs.is_release
        run: |
          rm -rf /tmp/cibmangotree
          rm -rf dist/CIBMangoTree
          rm -rf dist/CIBMangoTree.app

      - name: Inspect dist/ directory
        run: ${{ matrix.list_command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.artifact_path }}

      - name: Upload MSIX artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}_msix
          path: dist/${{ matrix.artifact_name }}.msix
